<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rulership ERP - Multi-Branch Supermarket Management System</title>
  
  <!-- Google Fonts: Inter, Hanken Grotesk, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0058be",
            "primary-container": "#d8e2ff",
            "on-primary-container": "#001a42",
            "on-primary": "#ffffff",
            "secondary": "#006c49",
            "secondary-container": "#6cf8bb",
            "on-secondary-container": "#00714d",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "warning": "#d97706",
            "warning-container": "#fef3c7",
            "on-warning-container": "#92400e",
            "tertiary": "#b61722",
            "tertiary-container": "#da3437",
            "background": "#f9f9ff",
            "surface": "#f9f9ff",
            "surface-dim": "#cfdaf2",
            "surface-bright": "#f9f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f0f3ff",
            "surface-container": "#e7eeff",
            "surface-container-high": "#dee8ff",
            "surface-container-highest": "#d8e3fb",
            "on-surface": "#111c2d",
            "on-surface-variant": "#424754",
            "outline": "#727785",
            "outline-variant": "#c2c6d6"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "body": ["Inter", "sans-serif"],
            "heading": ["Hanken Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="bg-background text-on-surface font-body antialiased flex h-screen overflow-hidden">
  <div id="app" class="flex w-full h-full"></div>
  <!-- Modal Overlay Container -->
  <div id="modal-root"></div>
  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
